<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a152d"/>
      <stop offset="45%" stop-color="#2d0c1b"/>
      <stop offset="100%" stop-color="#19060f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3d8"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#e8c868"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd1dc"/>
      <stop offset="60%" stop-color="#e28ca0"/>
      <stop offset="100%" stop-color="#9d3b5a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container with gentle rounded luxury contour -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.35"/>
  
  <!-- Subtle inner decorative border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Centered luxury V Monogram fused with a cut gem -->
  <g transform="translate(0, 8)">
    <!-- Gem facet backdrop glow -->
    <polygon points="256,108 356,220 256,388 156,220" fill="url(#roseGrad)" fill-opacity="0.18" filter="url(#glow)"/>

    <!-- Geometric diamond facets -->
    <polygon points="256,120 336,210 256,360 176,210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>
    <line x1="176" y1="210" x2="336" y2="210" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.5"/>
    <line x1="256" y1="120" x2="256" y2="360" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4"/>

    <!-- Stylized Royal "V" Ribbon -->
    <path d="M 160 138 Q 185 138 205 180 L 256 318 L 307 180 Q 327 138 352 138" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Inner bright stroke line -->
    <path d="M 166 142 Q 188 142 208 184 L 256 312 L 304 184 Q 324 142 346 142" 
          fill="none" 
          stroke="#fffaf0" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-opacity="0.9"/>

    <!-- Sparkling heart/star crown on top -->
    <circle cx="256" cy="116" r="10" fill="url(#goldGrad)"/>
    <polygon points="256,88 262,110 284,116 262,122 256,144 250,122 228,116 250,110" fill="#fffdfa"/>
  </g>
</svg>
