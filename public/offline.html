<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b0b1a" />
    <title>Hors ligne — Veloura</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Instrument Sans", system-ui, sans-serif;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(157, 59, 90, 0.28), transparent 50%),
          linear-gradient(160deg, #2b0b1a 0%, #15030d 100%);
        color: #f8efe8;
      }
      .card {
        width: min(100%, 24rem);
        padding: 2rem 1.5rem;
        border-radius: 1.25rem;
        border: 1px solid rgba(212, 175, 55, 0.28);
        background: rgba(255, 250, 245, 0.06);
        text-align: center;
        backdrop-filter: blur(8px);
      }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        object-fit: cover;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.45rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
        color: rgba(248, 239, 232, 0.78);
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 1.35rem;
        font: inherit;
        font-weight: 600;
        color: #2b0b1a;
        background: linear-gradient(135deg, #fdf3d8, #d4af37 55%, #aa7c11);
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>Tu es hors ligne</h1>
      <p>
        Veloura a besoin d’une connexion pour charger tes envies. Vérifie ton réseau puis
        réessaie.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
